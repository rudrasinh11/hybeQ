<!DOCTYPE html>
<html>
<head>
<style>
@font-face {
  font-family: 'vurasemiboldfonts';
  src: url('/Goldplay_SemiBold.ttf') format('truetype');
}
body { background: #0D0D0D; color: white; padding: 40px; font-family: 'vurasemiboldfonts', sans-serif; }
.stroke-test {
  font-size: 80px;
  font-family: 'vurasemiboldfonts', sans-serif;
  color: transparent;
  -webkit-text-stroke: 1.5px #FFDD00;
  text-transform: uppercase;
}
.solid-test {
  font-size: 80px;
  font-family: 'vurasemiboldfonts', sans-serif;
  color: #FFDD00;
  text-transform: uppercase;
}
</style>
</head>
<body>
  <div>
    <span style="font-size: 80px; color: white;">THE </span>
    <span class="solid-test">BOUND</span><span class="stroke-test">ARIES</span>
  </div>
</body>
</html>
